{{- /* Data in formato italiano, es. "9 ottobre 2026" */ -}}
{{- $mesi := slice "gennaio" "febbraio" "marzo" "aprile" "maggio" "giugno" "luglio" "agosto" "settembre" "ottobre" "novembre" "dicembre" -}}
<time datetime="{{ .Format "2006-01-02" }}">{{ .Day }} {{ index $mesi (sub .Month 1) }} {{ .Year }}</time>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="{{ site.Title }}, home">
      <img class="logo-light" src="{{ "img/logo-horizontal.png" | relURL }}" alt="{{ site.Title }}" width="665" height="160">
      <img class="logo-dark" src="{{ "img/logo-horizontal-dark.png" | relURL }}" alt="{{ site.Title }}" width="671" height="168">
    </a>
    <nav aria-label="Principale">
      <ul class="nav">
        {{- $page := . }}
        {{- range site.Menus.main }}
        <li><a href="{{ .URL }}"{{ if and .Page ($page.IsMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
      </ul>
    </nav>
    <button class="theme-toggle" type="button" aria-label="Cambia tema" hidden>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>
